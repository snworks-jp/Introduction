<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演奏会カレンダー｜SN Works</title>
<link rel="canonical" href="https://snworks-jp.github.io/Introduction/pages/concert-calendar.html">
<meta name="description" content="全国の演奏会を日付で探せるカレンダー。吹奏楽・オーケストラ・合唱・ジャズなど。投稿は確認してから掲載します。">
<style>
  :root { --bg:#eef1ff; --ink:#1a1a3c; --muted:#4f5078; --yellow:#ffd23f; --coral:#ff6b57; --blue:#3d5afe; --mint:#2fd39a; --violet:#8b5cf6; --paper:#fff; --line:#d9ddf3;
    --round:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--round); line-height:1.7; overflow-x:clip; }
  button, select, input, textarea { font:inherit; color:inherit; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 16px; }
  .bar { position:sticky; top:0; z-index:20; background:var(--ink); border-bottom:4px solid var(--yellow); }
  .bar .wrap { display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:12px; }
  .brand { color:#fff; font-weight:800; font-size:20px; text-decoration:none; }
  .mock[hidden]{display:none}
  .mock { background:var(--yellow); color:var(--ink); font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; }
  h1 { margin:28px 0 4px; font-size:clamp(26px,6vw,38px); line-height:1.3; font-weight:800; }
  .lede { margin:0 0 18px; color:var(--muted); font-size:15px; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid var(--ink); background:#fff; border-radius:999px; padding:3px 14px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip i { width:10px; height:10px; border-radius:50%; background:var(--c); display:inline-block; }
  .chip[aria-pressed="false"] { opacity:.45; border-style:dashed; }
  select { border:2px solid var(--ink); border-radius:999px; background:#fff; padding:3px 12px; font-size:13px; font-weight:700; }
  .spacer { flex:1; }
  .post { border:0; background:var(--coral); color:#fff; font-weight:800; border-radius:999px; padding:9px 20px; cursor:pointer; box-shadow:0 4px 0 #c4442f; transition:transform .12s, box-shadow .12s; }
  .post:hover { transform:translateY(2px); box-shadow:0 2px 0 #c4442f; }
  .tabs { display:inline-flex; background:#fff; border:2px solid var(--ink); border-radius:999px; overflow:hidden; }
  .tabs button { border:0; background:transparent; padding:5px 16px; font-weight:800; font-size:13px; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; }
  .layout { display:grid; gap:18px; grid-template-columns:1fr; align-items:start; padding-bottom:40px; }
  @media (min-width:900px) { .layout { grid-template-columns:1.55fr 1fr; } }
  .cal { background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:14px; box-shadow:6px 7px 0 var(--yellow); }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calhead h2 { margin:0; font-size:20px; }
  .nav { display:flex; gap:6px; }
  .nav button { width:36px; height:36px; border-radius:50%; border:2px solid var(--ink); background:#fff; font-weight:800; cursor:pointer; }
  .nav button:hover { background:var(--yellow); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dow { text-align:center; font-size:12px; font-weight:800; color:var(--muted); padding:4px 0; }
  .dow:first-child, .sun { color:#d4412c; } .dow:nth-child(7), .sat { color:var(--blue); }
  .day { position:relative; min-height:74px; border:1.5px solid var(--line); border-radius:10px; background:#fff; padding:4px 5px; text-align:left; cursor:pointer; overflow:hidden; }
  .day:hover { border-color:var(--ink); }
  .day.off { opacity:.35; }
  .day.today .n { background:var(--ink); color:#fff; }
  .day.sel { border:2px solid var(--ink); background:#fff9dc; }
  .n { display:inline-block; min-width:22px; text-align:center; border-radius:999px; font-size:12px; font-weight:800; }
  .ev { display:none; margin-top:2px; font-size:11px; line-height:1.3; padding:1px 5px; border-radius:5px; background:var(--c); color:#14142e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .dots { display:flex; gap:3px; flex-wrap:wrap; margin-top:4px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .more { display:none; font-size:11px; color:var(--muted); font-weight:700; }
  @media (min-width:640px) { .day { min-height:96px; } .ev { display:block; } .dots { display:none; } .more { display:block; } }
  .side h3 { margin:0 0 10px; font-size:18px; }
  .cards { list-style:none; margin:0; padding:0; display:grid; gap:14px; }
  .card { background:#fff; border-radius:6px 6px 16px 6px; padding:14px 16px 14px; border-top:8px solid var(--c); box-shadow:0 8px 0 -5px rgba(26,26,60,.12), 0 14px 22px -14px rgba(26,26,60,.35); }
  .card .g { display:inline-block; font-size:12px; font-weight:800; background:var(--c); padding:1px 10px; border-radius:999px; }
  .card strong { display:block; margin-top:6px; font-size:16px; line-height:1.45; }
  .card dl { margin:6px 0 0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13.5px; color:var(--muted); }
  .card dt { font-weight:800; color:var(--ink); } .card dd { margin:0; }
  .empty { background:#fff; border:2px dashed var(--line); border-radius:14px; padding:22px; text-align:center; color:var(--muted); font-size:14px; }
  .note { margin-top:14px; font-size:12.5px; color:var(--muted); }
  /* 一覧表示 */
  .listview { display:none; }
  .listview .dayhead { margin:16px 0 8px; font-size:15px; font-weight:800; }
  /* モーダル */
  dialog { border:3px solid var(--ink); border-radius:20px; padding:0; width:min(560px,94vw); background:#fff; box-shadow:8px 9px 0 var(--yellow); }
  dialog::backdrop { background:rgba(26,26,60,.55); }
  .fh { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:var(--ink); color:#fff; }
  .fh h2 { margin:0; font-size:18px; }
  .x { border:0; background:transparent; color:#fff; font-size:22px; cursor:pointer; }
  form { padding:16px 18px 18px; display:grid; gap:12px; }
  label { font-size:13px; font-weight:800; display:grid; gap:4px; }
  input, select.f, textarea { border:2px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff; width:100%; }
  .row { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  .warn { background:#fff4d6; border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.6; }
  .send { border:0; background:var(--blue); color:#fff; font-weight:800; border-radius:999px; padding:11px 20px; cursor:pointer; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .send[disabled] { opacity:.6; cursor:wait; }
  .card a.lk { display:inline-block; margin-top:8px; font-size:13px; font-weight:800; color:var(--blue); }
  .card .src { margin:4px 0 0; font-size:12px; color:var(--muted); }
  .state { text-align:center; color:var(--muted); padding:8px; font-size:14px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; }
  .toast.on { opacity:1; transform:translateX(-50%); }
  footer { padding:10px 0 40px; text-align:center; font-size:12.5px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .post, .toast { transition:none; } }
</style>
</head>
<body>

<div class="bar"><div class="wrap"><a class="brand" href="../">SN Works</a><span class="mock" id="demoBadge" hidden>サンプル表示</span></div></div>

<main class="wrap">
  <h1>演奏会カレンダー</h1>
  <p class="lede">全国の演奏会を、日付で探せます。投稿は、確認してから掲載します。</p>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="ジャンルで絞り込む"></div>
    <select id="region" aria-label="地域で絞り込む"><option value="">全国</option></select>
    <span class="spacer"></span>
    <div class="tabs" role="tablist" aria-label="表示の切り替え">
      <button role="tab" aria-selected="true" id="tabCal">カレンダー</button>
      <button role="tab" aria-selected="false" id="tabList">一覧</button>
    </div>
    <button class="post" id="openPost">演奏会を投稿する</button>
  </div>

  <div class="layout" id="calView">
    <section class="cal" aria-label="月のカレンダー">
      <div class="calhead">
        <h2 id="ym"></h2>
        <div class="nav"><button id="prev" aria-label="前の月">‹</button><button id="today" aria-label="今月" style="width:auto;padding:0 12px;border-radius:999px;font-size:12px">今月</button><button id="next" aria-label="次の月">›</button></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="side" aria-live="polite">
      <h3 id="selTitle"></h3>
      <ul class="cards" id="selCards"></ul>
      <p class="note">※掲載内容は、投稿者の申告や、公開されている情報にもとづきます。最新の情報は、各団体の案内でご確認ください。<br>※一部の演奏会は、<a href="https://www.concertsquare.jp/" target="_blank" rel="noopener noreferrer">コンサートスクウェア</a>の公開RSSをもとに掲載しています。</p>
    </aside>
  </div>

  <div class="listview" id="listView"></div>
</main>

<footer>© 2026 SN Works</footer>

<dialog id="dlg">
  <div class="fh"><h2>演奏会を投稿する</h2><button class="x" id="closePost" aria-label="閉じる">×</button></div>
  <form id="f">
    <label>演奏会の名前<input required name="name" maxlength="80" placeholder="例：○○市民吹奏楽団 定期演奏会"></label>
    <div class="row">
      <label>日付<input name="date" type="date" required></label>
      <label>開演時間<input name="time" type="time" value="14:00"></label>
    </div>
    <div class="row">
      <label>都道府県<select class="f" id="fPref" name="pref"></select></label>
      <label>会場名<input name="venue" maxlength="60" placeholder="例：○○文化会館"></label>
    </div>
    <div class="row">
      <label>ジャンル<select class="f" id="fGenre" name="genre"></select></label>
      <label>入場料<input name="fee" maxlength="40" placeholder="例：無料／1,000円"></label>
    </div>
    <label>詳細が分かるページのURL（任意）<input name="url" maxlength="300" type="url" placeholder="https://"></label>
    <p class="warn">電話番号・住所などの個人情報は書かないでください。投稿は、確認してから掲載します（掲載まで数日かかる場合があります）。</p>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="send" type="submit" id="sendBtn">この内容で投稿する</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
// ★ Apps Script をウェブアプリとして公開したURLをここに入れる（空だとサンプル表示）
const API_URL = "https://script.google.com/macros/s/AKfycbzChmP9zg4Dfhi9-nJwXjk52PpeUHCKR6QnizLfmC7dknPNIYEOCwWBeB8NX3NCoYTS/exec";

const GENRES=[["吹奏楽","#ffd23f"],["オーケストラ","#7f95ff"],["合唱","#ff8d7d"],["ジャズ","#55e0b0"],["室内楽","#b79bff"],["その他","#ffb86b"]];
const REGIONS={"北海道":["北海道"],"東北":["青森県","岩手県","宮城県","秋田県","山形県","福島県"],"関東":["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"],"中部":["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県"],"近畿":["滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],"中国":["鳥取県","島根県","岡山県","広島県","山口県"],"四国":["徳島県","香川県","愛媛県","高知県"],"九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]};
const prefRegion={};Object.entries(REGIONS).forEach(([r,ps])=>ps.forEach(p=>prefRegion[p]=r));
const gc=Object.fromEntries(GENRES);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const wd="日月火水木金土";
const now=new Date(), TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
let EV=[], ym=[now.getFullYear(),now.getMonth()], sel=TODAY, on=new Set(GENRES.map(g=>g[0])), reg="", status="loading";

function demo(){
  const mk=(off,t,name,genre,pref,venue,fee)=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off);return {d:key(d.getFullYear(),d.getMonth(),d.getDate()),t,name,genre,pref,venue,fee,url:""};};
  return [mk(1,"14:00","サンプル市民吹奏楽団 定期演奏会","吹奏楽","東京都","サンプル文化会館","無料"),mk(1,"18:00","サンプル・ジャズ・オーケストラ ライブ","ジャズ","神奈川県","サンプルライブハウス","2,000円"),mk(4,"15:00","サンプル交響楽団 演奏会","オーケストラ","福岡県","サンプル交響ホール","2,500円"),mk(8,"14:00","サンプル合唱団 コンサート","合唱","愛知県","サンプル芸術劇場","1,000円"),mk(12,"13:30","サンプル弦楽四重奏団","室内楽","京都府","サンプル教会","2,000円")];
}
async function load(){
  if(!API_URL){EV=demo();status="demo";$("#demoBadge").hidden=false;sel=EV[0].d;const d=new Date(sel+"T00:00");ym=[d.getFullYear(),d.getMonth()];render();return;}
  try{
    const r=await fetch(API_URL,{cache:"no-store"}); const j=await r.json();
    EV=(j.events||[]).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.d)).map(e=>({...e,genre:gc[e.genre]?e.genre:"その他"}));
    status="ok";
  }catch(err){status="error";}
  render();
}
const visible=()=>EV.filter(e=>on.has(e.genre)&&(!reg||prefRegion[e.pref]===reg));

$("#chips").innerHTML=GENRES.map(([g,c])=>`<button class="chip" style="--c:${c}" aria-pressed="true" data-g="${g}"><i></i>${g}</button>`).join("");
$("#region").innerHTML+=Object.keys(REGIONS).map(r=>`<option>${r}</option>`).join("");
$("#fPref").innerHTML=Object.values(REGIONS).flat().map(p=>`<option${p==="東京都"?" selected":""}>${p}</option>`).join("");
$("#fGenre").innerHTML=GENRES.map(g=>`<option>${g[0]}</option>`).join("");
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const g=b.dataset.g;on.has(g)?on.delete(g):on.add(g);b.setAttribute("aria-pressed",on.has(g));render();});
$("#region").onchange=e=>{reg=e.target.value;render();};

function card(e){
  const g=gc[e.genre]?e.genre:"その他", c=gc[g];
  const ok=/^https?:\/\//i.test(e.url||"");
  const link=ok?`<a class="lk" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer nofollow">${e.src?esc(e.src)+"で詳細を見る":"詳細ページを見る"} ↗</a>`:"";
  const src=e.src?`<p class="src">情報元：${esc(e.src)}</p>`:"";
  return `<li class="card" style="--c:${c}"><span class="g">${esc(g)}</span><strong>${esc(e.name)}</strong><dl><dt>日時</dt><dd>${+e.d.slice(5,7)}月${+e.d.slice(8)}日 ${e.t?esc(e.t)+"開演":"開演時間は未定"}</dd><dt>会場</dt><dd>${esc(e.pref)}${e.venue?"・"+esc(e.venue):""}</dd>${e.fee?`<dt>入場料</dt><dd>${esc(e.fee)}</dd>`:""}</dl>${link}${src}</li>`;
}
function render(){
  const [y,m]=ym; $("#ym").textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
  let h=[...wd].map(w=>`<div class="dow">${w}</div>`).join("");
  const ev=visible();
  for(let i=0;i<42;i++){
    let dd=i-first+1, yy=y, mm=m, off=false;
    if(dd<1){dd=prevDays+dd;mm=m-1;off=true;} else if(dd>days){dd=dd-days;mm=m+1;off=true;}
    if(mm<0){mm=11;yy=y-1;} if(mm>11){mm=0;yy=y+1;}
    const k=key(yy,mm,dd), list=ev.filter(e=>e.d===k), dow=i%7;
    h+=`<button class="day ${off?"off":""} ${k===TODAY?"today":""} ${k===sel?"sel":""}" data-k="${k}" aria-label="${mm+1}月${dd}日 ${list.length}件"><span class="n ${dow==0?"sun":dow==6?"sat":""}">${dd}</span>`+
      list.slice(0,2).map(e=>`<span class="ev" style="--c:${gc[e.genre]||gc["その他"]}">${esc(e.name)}</span>`).join("")+
      (list.length>2?`<span class="more">ほか${list.length-2}件</span>`:"")+
      `<span class="dots">${list.map(e=>`<i style="--c:${gc[e.genre]||gc["その他"]}"></i>`).join("")}</span></button>`;
  }
  $("#grid").innerHTML=h;
  const sl=ev.filter(e=>e.d===sel).sort((a,b)=>(a.t||"").localeCompare(b.t||"")), sd=new Date(sel+"T00:00");
  $("#selTitle").textContent=`${sd.getMonth()+1}月${sd.getDate()}日（${wd[sd.getDay()]}）の演奏会`;
  $("#selCards").innerHTML=status==="loading"?`<li class="state">読み込み中…</li>`:status==="error"?`<li class="empty">読み込めませんでした。時間をおいて、もう一度開いてください。</li>`:
    sl.length?sl.map(card).join(""):`<li class="empty">この日の演奏会は、まだ載っていません。<br>知っている演奏会があれば、投稿してください。</li>`;
  const mon=ev.filter(e=>e.d.startsWith(`${y}-${pad(m+1)}`)).sort((a,b)=>a.d.localeCompare(b.d)||(a.t||"").localeCompare(b.t||""));
  let lh="",last="";
  mon.forEach(e=>{if(e.d!==last){last=e.d;const d=new Date(e.d+"T00:00");lh+=`${lh?"</ul>":""}<h3 class="dayhead">${d.getMonth()+1}月${d.getDate()}日（${wd[d.getDay()]}）</h3><ul class="cards">`;}lh+=card(e);});
  $("#listView").innerHTML=lh?lh+"</ul>":`<p class="empty">この月の演奏会は、まだ載っていません。</p>`;
}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;sel=b.dataset.k;render();});
$("#prev").onclick=()=>{ym=ym[1]==0?[ym[0]-1,11]:[ym[0],ym[1]-1];render();};
$("#next").onclick=()=>{ym=ym[1]==11?[ym[0]+1,0]:[ym[0],ym[1]+1];render();};
$("#today").onclick=()=>{ym=[now.getFullYear(),now.getMonth()];sel=TODAY;render();};
function tab(cal){ $("#calView").style.display=cal?"":"none"; $("#listView").style.display=cal?"none":"block"; $("#tabCal").setAttribute("aria-selected",cal); $("#tabList").setAttribute("aria-selected",!cal); }
$("#tabCal").onclick=()=>tab(true); $("#tabList").onclick=()=>tab(false);
const dlg=$("#dlg"), toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3600);};
$("#openPost").onclick=()=>{ const f=$("#f"); if(!f.date.value){const d=new Date(now.getTime()+7*864e5);f.date.value=key(d.getFullYear(),d.getMonth(),d.getDate());} dlg.showModal(); };
$("#closePost").onclick=()=>dlg.close();
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const f=e.target, btn=$("#sendBtn");
  if(!API_URL){dlg.close();toast("サンプル表示のため、送信はされません。");return;}
  const body={name:f.name.value,date:f.date.value,time:f.time.value,pref:f.pref.value,venue:f.venue.value,genre:f.genre.value,fee:f.fee.value,url:f.url.value,website:f.website.value};
  btn.disabled=true;
  try{
    await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    dlg.close(); f.reset(); toast("投稿を受け付けました。確認後に掲載します。");
  }catch(err){ toast("送信できませんでした。時間をおいて、もう一度お試しください。"); }
  btn.disabled=false;
};
render(); load();
</script>
</body>
</html>
